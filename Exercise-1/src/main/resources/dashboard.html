<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    main {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
    }
    section {
      margin-bottom: 24px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .status-display {
      display: inline-block;
      min-width: 180px;
      padding: 12px 16px;
      border: 1px solid #a1a1aa;
      border-radius: 6px;
      background: #fafafa;
      font-family: Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
    }
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    button {
      min-height: 42px;
      border: 1px solid #71717a;
      border-radius: 6px;
      background: #ffffff;
      color: #18181b;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #f4f4f5; }
    button:active { transform: translateY(1px); }
    .pin-display {
      width: 100%;
      max-width: 260px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid #a1a1aa;
      border-radius: 6px;
      background: #fafafa;
      font-family: Consolas, monospace;
      font-size: 22px;
      letter-spacing: 4px;
      text-align: center;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      gap: 8px;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .primary { background: #27272a; color: #ffffff; }
    .primary:hover { background: #3f3f46; }
    .message {
      min-height: 20px;
      margin-top: 12px;
      color: #52525b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Alarm Dashboard</h1>

    <section>
      <h2>Status</h2>
      <span id="status" class="status-display">...</span>
    </section>

    <section>
      <h2>Sensori</h2>
      <div id="sensors" class="sensor-grid"></div>
    </section>

    <section>
      <h2>Tastierino</h2>
      <input id="pin" class="pin-display" type="password" readonly autocomplete="off">
      <div class="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" id="clear">C</button>
        <button type="button" data-key="0">0</button>
        <button type="button" id="backspace">Del</button>
      </div>
      <div class="actions">
        <button id="arm" class="primary" type="button">Arm</button>
        <button id="unarm" type="button">Unarm</button>
      </div>
      <div id="message" class="message"></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const sensorsEl = document.getElementById("sensors");
    const pinEl = document.getElementById("pin");
    const messageEl = document.getElementById("message");

    function setMessage(message) {
      messageEl.textContent = message;
    }

    async function callText(url, options) {
      const response = await fetch(url, options || {});
      const text = await response.text();
      if (!response.ok) {
        throw new Error(text || response.statusText);
      }
      return text;
    }

    async function updateStatus() {
      try {
        statusEl.textContent = await callText("/getStatus");
      } catch (error) {
        statusEl.textContent = "Errore";
      }
    }

    async function loadSensors() {
      try {
        const response = await fetch("/sensors");
        const sensors = await response.json();
        sensorsEl.replaceChildren();

        sensors.forEach(function(sensorName) {
          const button = document.createElement("button");
          button.className = "sensor-button";
          button.type = "button";
          button.textContent = "Trigger " + sensorName;
          button.addEventListener("click", async function() {
            try {
              const result = await callText("/trigger/" + encodeURIComponent(sensorName), { method: "POST" });
              setMessage(result);
              await updateStatus();
            } catch (error) {
              setMessage(error.message);
            }
          });
          sensorsEl.appendChild(button);
        });
      } catch (error) {
        setMessage("Errore caricamento sensori");
      }
    }

    document.querySelectorAll("[data-key]").forEach(function(button) {
      button.addEventListener("click", function() {
        pinEl.value = pinEl.value + button.dataset.key;
      });
    });

    document.getElementById("clear").addEventListener("click", function() {
      pinEl.value = "";
    });

    document.getElementById("backspace").addEventListener("click", function() {
      pinEl.value = pinEl.value.slice(0, -1);
    });

    document.getElementById("arm").addEventListener("click", async function() {
      try {
        const result = await callText("/arm/" + encodeURIComponent(pinEl.value), { method: "POST" });
        setMessage(result);
        await updateStatus();
      } catch (error) {
        setMessage(error.message);
      }
    });

    document.getElementById("unarm").addEventListener("click", async function() {
      try {
        const result = await callText("/unarm/" + encodeURIComponent(pinEl.value), { method: "POST" });
        setMessage(result);
        await updateStatus();
      } catch (error) {
        setMessage(error.message);
      }
    });

    loadSensors();
    updateStatus();
    setInterval(updateStatus, 1000);
  </script>
</body>
</html>
