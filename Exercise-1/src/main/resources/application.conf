pekko {
  actor {
    provider = cluster
    serialization-bindings {
      # I messaggi che estendono CborSerializable vengono serializzati con Jackson CBOR per l'invio tra nodi.
      "CborSerializable" = jackson-cbor
    }
  }
  remote.artery.canonical {
    hostname = "127.0.0.1"
      # port is skipped here we inject it dynamically via code
    }
  cluster {
    seed-nodes = [
      "pekko://Alarm@127.0.0.1:7355",
      "pekko://Alarm@127.0.0.1:7356"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    # Keep the alarm state and timers while the entity is idle.
    sharding.passivation.strategy = none
  }
}
