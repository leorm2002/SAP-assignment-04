pekko {
  actor {
    provider = "cluster"
  }
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      # port is skipped here we inject it dynamically via code
    }
  }
  cluster {
    seed-nodes = [
      "pekko://Alarm@127.0.0.1:7355",
      "pekko://Alarm@127.0.0.1:7356"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}